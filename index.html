<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Story</title>
    <link rel="icon" href="monthsary/chapter-01/assets/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-cream: #fdfbf7;
        --color-blush: #fcd5ce;
        --color-lavender: #e8e8f2;
        --color-text-dark: #3a2e28;
        --color-text-light: #5a4b42;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 3rem 1.25rem;
        font-family: "Inter", sans-serif;
        color: var(--color-text-dark);
        background: linear-gradient(-45deg, var(--color-cream), var(--color-blush), var(--color-lavender));
        background-attachment: fixed;
      }

      main {
        max-width: 32rem;
        margin: 0 auto;
      }

      h1,
      h2 {
        font-family: "Playfair Display", serif;
        font-weight: 600;
      }

      h1 {
        margin: 0 0 0.25rem;
        font-size: 2.25rem;
        text-align: center;
      }

      .subtitle {
        margin: 0 0 2.5rem;
        font-family: "Playfair Display", serif;
        font-style: italic;
        color: var(--color-text-light);
        text-align: center;
      }

      h2 {
        margin: 0 0 1rem;
        font-size: 1.25rem;
      }

      section + section {
        margin-top: 2.5rem;
      }

      .chapters {
        display: grid;
        gap: 0.75rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .card {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 1rem 1.25rem;
        background: rgba(253, 251, 247, 0.75);
        border: 1px solid rgba(58, 46, 40, 0.08);
        border-radius: 1rem;
      }

      .card-title {
        font-weight: 500;
      }

      .actions {
        display: flex;
        gap: 0.5rem;
      }

      .button {
        padding: 0.5rem 0.9rem;
        font: inherit;
        font-size: 0.875rem;
        color: var(--color-text-dark);
        text-decoration: none;
        cursor: pointer;
        background: var(--color-cream);
        border: 1px solid rgba(58, 46, 40, 0.2);
        border-radius: 999px;
      }

      .button:hover,
      .button:focus-visible {
        background: var(--color-blush);
      }

      .button-primary {
        color: var(--color-cream);
        background: var(--color-text-dark);
        border-color: var(--color-text-dark);
      }

      .button-primary:hover,
      .button-primary:focus-visible {
        color: var(--color-text-dark);
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Our Story</h1>
      <p class="subtitle">One chapter at a time</p>
      <div id="sections"></div>
      <p id="status" class="visually-hidden" aria-live="polite"></p>
    </main>

    <script>
      // Add a new chapter by adding one line here.
      // url: a path inside this site (ends with "/") or a full external link.
      const chapters = [
        { section: "Monthsary", title: "Chapter 01: 1st Monthsary", url: "monthsary/chapter-01/" },
        {
          section: "Monthsary",
          title: "Chapter 02: 2nd Monthsary",
          url: "https://digibouquet.net/bouquet/99c789a5-8214-433d-8c2b-5e7094a3363d",
        },
      ];

      // Sections only show when they have at least one chapter.
      const sectionOrder = ["Monthsary", "Anniversary"];
      const container = document.getElementById("sections");
      const status = document.getElementById("status");

      function fullUrl(url) {
        return new URL(url, document.baseURI).href;
      }

      async function copyLink(button, url, title) {
        try {
          await navigator.clipboard.writeText(url);
          button.textContent = "Copied!";
          status.textContent = "Copied link to " + title;
        } catch {
          window.prompt("Copy this link:", url);
        }
        setTimeout(() => (button.textContent = "Copy link"), 1500);
      }

      for (const name of sectionOrder) {
        const items = chapters.filter((chapter) => chapter.section === name);
        if (items.length === 0) continue;

        const section = document.createElement("section");
        const heading = document.createElement("h2");
        heading.textContent = name;
        const list = document.createElement("ul");
        list.className = "chapters";

        for (const chapter of items) {
          const link = fullUrl(chapter.url);
          const item = document.createElement("li");
          item.className = "card";

          const title = document.createElement("span");
          title.className = "card-title";
          title.textContent = chapter.title;

          const actions = document.createElement("div");
          actions.className = "actions";

          const open = document.createElement("a");
          open.className = "button button-primary";
          open.href = link;
          open.textContent = "Open";
          open.setAttribute("aria-label", "Open " + chapter.title);

          const copy = document.createElement("button");
          copy.type = "button";
          copy.className = "button";
          copy.textContent = "Copy link";
          copy.setAttribute("aria-label", "Copy link to " + chapter.title);
          copy.addEventListener("click", () => copyLink(copy, link, chapter.title));

          actions.append(open, copy);
          item.append(title, actions);
          list.append(item);
        }

        section.append(heading, list);
        container.append(section);
      }
    </script>
  </body>
</html>
